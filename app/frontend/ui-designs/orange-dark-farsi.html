<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fffefa" />
    <title>گالری معنایی — جزئیات عکاسی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Changa:wght@200..800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f1ea;
        --paper: #ffffff;
        --ink: #343a40;
        --muted: #777b80;
        --line: #d8d5ce;
        --primary: #172536;
        --primary-dark: #101c2a;
        --mulberry: #7a3e5d;
        --blue: #172536;
        --mint: #e8e9e7;
        --peach: #e9e1d5;
        --yellow: #f1ebdd;
        --lav: #e8e6e1;
        --shadow: 0 14px 40px #17253612;
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image: radial-gradient(#66604b0c 0.65px, transparent 0.65px);
        background-size: 19px 19px;
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
      }
      .sidebar {
        height: 100vh;
        position: sticky;
        top: 0;
        background: #fffefa;
        border-right: 1px solid var(--line);
        padding: 28px 18px 22px;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 9px;
        margin: 0 0 48px;
      }
      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(145deg, #301523, #5a434f);
        display: grid;
        place-items: center;
        color: white;
        box-shadow: 0 7px 18px #39453630;
      }
      .brand-icon svg {
        width: 31px;
        height: 31px;
      }
      .brand-name {
        font-weight: 750;
        font-size: 17px;
        letter-spacing: -0.65px;
        white-space: nowrap;
      }
      .brand-name span {
        display: block;
        color: #99968b;
        font-size: 9px;
        letter-spacing: 2.1px;
        text-transform: uppercase;
        margin-top: 2px;
        font-weight: 700;
      }
      .nav-label {
        padding: 0 12px;
        margin: 0 0 12px;
        color: #a09f93;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 14px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: #77796f;
        text-align: left;
        font-size: 13px;
        font-weight: 650;
        transition: 0.18s;
      }
      .nav button:hover {
        background: #edf0e9;
        color: var(--ink);
      }
      .nav button.active {
        background: #edf0e9;
        color: var(--primary-dark);
      }
      .nav svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .side-note {
        margin-top: auto;
        padding: 17px;
        border-radius: 17px;
        background: linear-gradient(145deg, #edf0e9, #f3eee6);
        color: #455875;
      }
      .side-note .sun {
        font-size: 20px;
      }
      .side-note strong {
        display: block;
        font-size: 12px;
        margin: 9px 0 5px;
        color: #394536;
      }
      .side-note p {
        font-size: 10px;
        line-height: 1.6;
        margin: 0;
        color: #898980;
      }
      .main {
        min-width: 0;
        max-width: 1680px;
        width: 100%;
        margin: auto;
        padding: 0 54px 55px;
      }
      .topbar {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--ink);
        font-weight: 700;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-btn {
        width: 39px;
        height: 39px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: white;
        color: #465541;
        display: grid;
        place-items: center;
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .upload {
        border: 0;
        background: var(--primary);
        color: white;
        padding: 12px 17px;
        border-radius: 11px;
        font-size: 12px;
        font-weight: 750;
        box-shadow: 0 7px 18px #46554128;
      }
      .upload:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      .page-intro {
        padding: 45px 0 24px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.7px;
        text-transform: uppercase;
        color: #68765f;
        font-weight: 800;
        margin: 0 0 11px;
      }
      .page-intro h1 {
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: clamp(38px, 4.5vw, 58px);
        letter-spacing: -1.5px;
        line-height: 1.05;
        margin: 0 0 12px;
        color: #292b26;
      }
      .page-intro h1 em {
        color: #68765f;
        font-weight: 500;
      }
      .page-intro p.sub {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        line-height: 1.7;
      }
      .search-row {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 10px 0 30px;
      }
      .searchbox {
        height: 57px;
        max-width: 740px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 13px;
        background: #fffefa;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0 17px;
        box-shadow: 0 5px 20px #26334208;
      }
      .searchbox svg {
        width: 19px;
        stroke: #8d9685;
        fill: none;
        stroke-width: 1.8;
      }
      .searchbox input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 13px;
      }
      .searchbox input::placeholder {
        color: #aaa99f;
      }
      .search-submit {
        height: 47px;
        padding: 0 19px;
        border: 0;
        border-radius: 11px;
        background: var(--primary);
        color: white;
        font-size: 12px;
        font-weight: 750;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 30px;
      }
      .feature {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        min-height: 300px;
        margin: 0 0 38px;
        background: #4c6c75;
        color: white;
        box-shadow: var(--shadow);
      }
      .feature img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.72);
      }
      .feature:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #152d36c9 0%,
          #152d3650 55%,
          transparent 100%
        );
      }
      .feature-copy {
        position: relative;
        z-index: 1;
        padding: 42px 45px;
        max-width: 490px;
      }
      .feature-copy .eyebrow {
        color: #f5d9e9;
      }
      .feature-copy h2 {
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: 37px;
        line-height: 1.12;
        margin: 0 0 10px;
      }
      .feature-copy p {
        font-size: 12px;
        color: #ffffffd9;
        line-height: 1.7;
        margin: 0 0 20px;
      }
      .feature-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 15px;
        background: #ffffffed;
        color: #172b4d;
        border-radius: 11px;
        font-size: 11px;
        font-weight: 800;
        border: 0;
      }
      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin: 0 0 18px;
      }
      .section-head h2 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.5px;
        margin: 0 0 5px;
        color: #292b26;
      }
      .section-head p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
      }
      .section-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sort {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        background: #fffefa;
        color: #65717b;
        font-size: 11px;
        outline: 0;
      }
      .filters {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 0 0 18px;
        scrollbar-width: none;
      }
      .filters::-webkit-scrollbar {
        display: none;
      }
      .filter-chip {
        white-space: nowrap;
        border: 1px solid var(--line);
        background: #fffefa;
        color: #77796f;
        padding: 8px 13px;
        border-radius: 30px;
        font-size: 10px;
        font-weight: 700;
      }
      .filter-chip.active {
        background: #465541;
        border-color: #465541;
        color: #fff;
      }
      .gallery {
        columns: 3 250px;
        column-gap: 19px;
      }
      .photo-card {
        display: inline-block;
        width: 100%;
        break-inside: avoid;
        margin: 0 0 19px;
        background: #fffefa;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 3px 12px #26334206;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        cursor: pointer;
      }
      .photo-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
      .photo-wrap {
        position: relative;
        overflow: hidden;
        background: #f0eee9;
      }
      .photo-wrap img {
        display: block;
        width: 100%;
        height: auto;
        min-height: 210px;
        max-height: 440px;
        object-fit: cover;
        transition: transform 0.5s;
      }
      .photo-card:hover .photo-wrap img {
        transform: scale(1.025);
      }
      .photo-tag {
        position: absolute;
        left: 13px;
        top: 13px;
        padding: 7px 10px;
        border-radius: 30px;
        background: #f4f2ebed;
        color: #465541;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.4px;
        backdrop-filter: blur(8px);
      }
      .photo-info {
        padding: 14px 15px 15px;
      }
      .photo-title {
        font-size: 13px;
        font-weight: 750;
        margin: 0 0 7px;
        letter-spacing: -0.1px;
        color: #30342b;
      }
      .photo-bio {
        font-size: 11px;
        color: #898980;
        line-height: 1.55;
        margin: 0 0 10px;
      }
      .photo-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #929186;
        font-size: 10px;
      }
      .photo-meta span:first-child {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .photo-meta svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
      }
      .album-grid,
      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 19px;
      }
      .album-card,
      .category-card {
        border: 1px solid var(--line);
        background: #fffefa;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
      }
      .album-card:hover,
      .category-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
      .album-cover {
        height: 245px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 4px;
        background: #fff;
        padding: 4px;
      }
      .album-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        min-height: 0;
      }
      .album-cover img:first-child {
        grid-row: span 2;
      }
      .album-info {
        padding: 16px 17px 18px;
      }
      .album-info h3,
      .category-info h3 {
        font-family: "Playfair Display", serif;
        font-size: 21px;
        font-weight: 500;
        margin: 0 0 5px;
        color: #292b26;
      }
      .album-info p,
      .category-info p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
      }
      .category-card {
        position: relative;
        min-height: 240px;
        display: flex;
        align-items: flex-end;
        padding: 22px;
        background: #e9ede5;
        color: white;
        overflow: hidden;
      }
      .category-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.68);
        transition: transform 0.5s;
      }
      .category-card:hover img {
        transform: scale(1.04);
      }
      .category-card:after {
        content: "";
        position: absolute;
        inset: 35% 0 0;
        background: linear-gradient(transparent, #172b32a8);
      }
      .category-info {
        position: relative;
        z-index: 1;
      }
      .category-info h3 {
        font-size: 25px;
        margin-bottom: 5px;
        color: white;
      }
      .category-info p {
        color: #ffffffd9;
      }
      .empty {
        padding: 55px 20px;
        text-align: center;
        background: #fffefa;
        border: 1px dashed var(--line);
        border-radius: 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-family: "Playfair Display", serif;
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .footer b {
        color: var(--primary);
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translate(-50%, 15px);
        background: #303d2d;
        color: #fff;
        padding: 12px 17px;
        border-radius: 12px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 20;
        box-shadow: 0 8px 30px #0002;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .mobile-menu {
        display: none;
      }
      @media (max-width: 1100px) {
        .main {
          padding: 0 32px 45px;
        }
        .album-grid,
        .category-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .gallery {
          columns: 2 230px;
        }
      }
      @media (max-width: 760px) {
        .app {
          display: block;
        }
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 260px;
          height: 100dvh;
          transform: translateX(-105%);
          transition: transform 0.25s;
          box-shadow: 12px 0 40px #26334215;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .mobile-menu {
          display: grid;
        }
        .main {
          padding: 0 20px 40px;
        }
        .topbar {
          height: 70px;
        }
        .page-intro {
          padding: 35px 0 20px;
        }
        .feature {
          min-height: 280px;
        }
        .feature-copy {
          padding: 30px 25px;
        }
        .feature-copy h2 {
          font-size: 31px;
        }
        .album-grid,
        .category-grid {
          grid-template-columns: 1fr 1fr;
        }
        .album-cover {
          height: 180px;
        }
        .gallery {
          columns: 2 180px;
        }
      }
      @media (max-width: 480px) {
        .main {
          padding: 0 15px 32px;
        }
        .top-actions {
          gap: 6px;
        }
        .upload {
          padding: 10px 12px;
        }
        .page-intro h1 {
          font-size: 39px;
        }
        .search-row {
          gap: 7px;
        }
        .search-submit {
          padding: 0 12px;
        }
        .gallery {
          columns: 1;
        }
        .photo-wrap img {
          max-height: none;
        }
        .album-grid,
        .category-grid {
          grid-template-columns: 1fr;
        }
        .album-cover {
          height: 230px;
        }
      }
      .subnav {
        display: none;
        margin: -2px 0 7px 43px;
        padding-left: 13px;
        border-left: 1px solid #e1e4da;
        gap: 3px;
      }
      .subnav.open {
        display: grid;
      }
      .subnav button {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 8px 7px;
        color: #77796f;
        font-size: 11px;
        border-radius: 7px;
      }
      .nav-expand {
        margin-left: auto;
        width: 25px;
        height: 25px;
        flex: 0 0 25px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        font-size: 16px;
        line-height: 1;
        color: #78869a;
        transition:
          transform 0.2s,
          background 0.2s;
        cursor: pointer;
        z-index: 2;
      }
      .nav-expand:hover {
        background: #edf0e9;
        color: #394536;
      }
      .nav button[aria-expanded="true"] .nav-expand {
        transform: rotate(180deg);
        background: #edf0e9;
        color: #394536;
      }
      .collection-count {
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 14px;
      }
      .compact-section {
        align-items: center;
        margin: 0 0 17px;
      }
      .compact-tools {
        padding-top: 27px;
      }
      .filters {
        padding-top: 0;
      }
      .photo-wrap:after {
        content: "";
        position: absolute;
        inset: 10px;
        pointer-events: none;
        opacity: 0;
        background:
          linear-gradient(#fff, #fff) left top/13px 1.5px no-repeat,
          linear-gradient(#fff, #fff) left top/1.5px 13px no-repeat,
          linear-gradient(#fff, #fff) right top/13px 1.5px no-repeat,
          linear-gradient(#fff, #fff) right top/1.5px 13px no-repeat,
          linear-gradient(#fff, #fff) left bottom/13px 1.5px no-repeat,
          linear-gradient(#fff, #fff) left bottom/1.5px 13px no-repeat,
          linear-gradient(#fff, #fff) right bottom/13px 1.5px no-repeat,
          linear-gradient(#fff, #fff) right bottom/1.5px 13px no-repeat;
        transition: opacity 0.22s ease;
      }
      .photo-card:hover .photo-wrap:after {
        opacity: 0.82;
      }
      .brand-icon {
        border-radius: 12px;
      }
      .brand-icon svg {
        width: 34px;
        height: 34px;
      }
      .mini-camera,
      .crumb-camera {
        position: relative;
        display: inline-block;
        width: 13px;
        height: 9px;
        flex: 0 0 auto;
        border: 1.2px solid currentColor;
        border-radius: 2.5px;
        opacity: 0.72;
      }
      .mini-camera:before,
      .crumb-camera:before {
        content: "";
        position: absolute;
        left: 3px;
        top: -3.5px;
        width: 5px;
        height: 3px;
        border: 1px solid currentColor;
        border-bottom: 0;
        border-radius: 2px 2px 0 0;
      }
      .mini-camera:after,
      .crumb-camera:after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 3px;
        height: 3px;
        border: 1px solid currentColor;
        border-radius: 50%;
      }
      .crumb-camera {
        margin-right: 7px;
        vertical-align: -1px;
        color: var(--primary);
      }
      .page-intro {
        position: relative;
      }
      .page-intro:after {
        content: "";
        position: absolute;
        right: 5px;
        top: 42px;
        width: 62px;
        height: 46px;
        border: 1px solid #46554119;
        border-radius: 9px;
        opacity: 0.8;
        background:
          radial-gradient(
            circle at 50% 56%,
            transparent 0 9px,
            #46554120 9.5px 10.5px,
            transparent 11px
          ),
          radial-gradient(
            circle at 50% 56%,
            transparent 0 4px,
            #46554120 4.5px 5.5px,
            transparent 6px
          );
      }
      .page-intro:before {
        content: "";
        position: absolute;
        right: 18px;
        top: 35px;
        width: 18px;
        height: 7px;
        border: 1px solid #46554119;
        border-bottom: 0;
        border-radius: 4px 4px 0 0;
      }
      @media (max-width: 600px) {
        .page-intro:after,
        .page-intro:before {
          display: none;
        }
      }
      .photographer-signature {
        margin-top: auto;

      const norm = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/ي/g, "ی")
          .replace(/ك/g, "ک")
          .replace(/[\u064b-\u065f]/g, "")
          .replace(/[\u200c_]/g, " ")
          .replace(/[^\p{L}\p{N}\s]/gu, " ");
      const words = (t) => norm(t).split(/\s+/).filter(Boolean);
      function bigrams(w) {
        if (w.length < 2) return [w];
        const r = [];
        for (let i = 0; i < w.length - 1; i++) r.push(w.slice(i, i + 2));
        return r;
      }
      function dice(a, b) {
        const A = bigrams(a), B = bigrams(b), used = new Array(B.length).fill(false);
        let m = 0;
        A.forEach((x) => {
          const j = B.findIndex((y, k) => !used[k] && y === x);
          if (j > -1) { used[j] = true; m++; }
        });
        return (2 * m) / (A.length + B.length);
      }
      function similarity(p, q) {
        const qw = words(q);
        if (!qw.length) return 0;
        const doc = words([p.title, p.bio, p.place, p.category, p.album, p.tag, KW[p.id] || ""].join(" "));
        if (!doc.length) return 0;
        let total = 0;
        qw.forEach((t) => {
          let best = 0;
          doc.forEach((w) => {
            let v;
            if (w === t) v = 1;
            else if (t.length >= 3 && (w.includes(t) || (w.length >= 3 && t.includes(w)))) v = 0.85;
            else v = dice(t, w) * 0.7;
            if (v > best) best = v;
          });
          total += best;
        });
        return Math.round((total / qw.length) * 100);
      }
      function cardInner(p, score) {
        return `<div class="photo-wrap"><img loading="lazy" src="${p.img}" alt="${p.alt}"><span class="photo-tag">${p.tag}</span></div>${score != null ? `<div class="match"><span>شباهت به جستجو</span><b>${fa(score)}٪</b></div>` : ""}<div class="photo-info"><h3 class="photo-title">${p.title}</h3><p class="photo-bio">${p.bio || "لحظه‌ای که ارزش نگه‌داشتن دارد."}</p><div class="photo-meta"><span>⌖ ${p.place}</span><span>${new Date(p.date + "T12:00:00").toLocaleDateString("fa-IR", { month: "short", day: "numeric", year: "numeric" })}</span></div></div>`;

      }
      function intro(eyebrow, title, sub) {

      }
      function stopFeed() {
        (window.feedTimers || []).forEach((t) => { clearTimeout(t); clearInterval(t); });

      /* gives every card its own time slot, so neighbouring cards never change close together */
      function spreadOrder(n, cols) {
        const pairs = [];
        for (let i = 0; i < n; i++) {
          if (i % cols < cols - 1 && i + 1 < n) pairs.push([i, i + 1]);
          if (i + cols < n) pairs.push([i, i + cols]);
        }
        const dist = (a, b) => { const d = Math.abs(a - b); return Math.min(d, n - d); };
        let best = [...Array(n).keys()], bestScore = -1;
        for (let t = 0; t < 600; t++) {
          const perm = [...Array(n).keys()].sort(() => Math.random() - 0.5);
          const ds = pairs.map(([a, b]) => dist(perm[a], perm[b]));
          const score = (ds.length ? Math.min(...ds) : n) * 1000 + ds.reduce((s, d) => s + d, 0);
          if (score > bestScore) { bestScore = score; best = perm; }
        }
        return best;
      }
      function startFeed() {
        stopFeed();
        const gal = document.querySelector(".gallery.feed");
        const cards = gal ? [...gal.querySelectorAll(".photo-card")] : [];
        if (!cards.length || all().length <= cards.length) return;
        const PERIOD = 7000, FADE = 600;
        const cols = getComputedStyle(gal).gridTemplateColumns.split(" ").length || 1;
        const slot = spreadOrder(cards.length, cols);
        const swap = (card) => {
          if (!card.isConnected) return;
          const shown = new Set([...document.querySelectorAll(".gallery.feed .photo-card")].map((c) => String(c.dataset.photo)));
          const free = all().filter((p) => !shown.has(String(p.id)));

              card.dataset.photo = p.id;
              card.innerHTML = cardInner(p);
              card.classList.remove("swapping");

          };

          renderSearch();
        };
        document.getElementById("mic-btn").onclick = startVoice;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            query = input.value;
            renderSearch();
          }
        });
        if (!q) startFeed();
      }
      function renderLibrary() {
        let items = all();
        view.innerHTML = `<div class="compact-tools"><div class="filters" id="library-filters">${["All", "آدم‌ها", "مکان‌ها", "سفر", "طبیعت", "خوراک و نوشیدنی"].map((x) => `<button class="filter-chip ${activeCategory === x ? "active" : ""}" data-category="${x}">${x === "All" ? "همه" : x}</button>`).join("")}</div><div class="collection-count">${fa(items.length)} عکس</div><div id="library-gallery">${gallery(activeCategory === "All" ? items : items.filter((p) => p.category === activeCategory))}</div></div>`;
        document.querySelectorAll("[data-category]").forEach(
          (b) =>
            (b.onclick = () => {
              activeCategory = b.dataset.category;
              renderLibrary();
            }),
        );
      }
      function renderAlbums() {
        const albums = [
          {
            name: "لحظات دوست‌داشتنی تابستان",
            desc: "لحظات دوست‌داشتنی تابستان",
            ids: [1, 4, 5, 7],
            cover: [1, 4, 5],
          },
          {
            name: "آدم‌های دوست‌داشتنی",
            desc: "چهره‌هایی که هر روز را روشن‌تر می‌کنند",
            ids: [3, 8, 12],
            cover: [3, 8, 12],
          },
          {
            name: "خاطرات مدرسه",
            desc: "خاطرات مدرسه",
            ids: [2, 6, 9, 10],
            cover: [2, 6, 9],
          },
          {
            name: "غروب آفتاب",
            desc: "غروب آفتاب",
            ids: [11],
            cover: [11],
          },
        ];
        view.innerHTML = `<div class="collection-count">${fa(albums.length)} آلبوم</div>${activeAlbum === "All" ? `<div class="album-grid">${albums.map((a) => `<article class="album-card" data-album="${a.name}"><div class="album-cover">${a.cover.map((id) => `<img src="${all().find((p) => p.id === id)?.img || ""}" alt="">`).join("")}</div><div class="album-info"><h3>${a.name}</h3><p>${fa(a.ids.length)} عکس</p></div></article>`).join("")}</div>` : `<div class="section-head compact-section"><button class="filter-chip" id="all-albums">→ همه‌ی آلبوم‌ها</button><span class="collection-count">${activeAlbum}</span></div>${gallery(all().filter((p) => p.album === activeAlbum))}`}`;
        document.querySelectorAll("[data-album]").forEach(
          (c) =>
            (c.onclick = () => {
              activeAlbum = c.dataset.album;
              renderAlbums();
            }),
        );
        let back = document.getElementById("all-albums");
        if (back)
          back.onclick = () => {
            activeAlbum = "All";
            renderAlbums();
          };
      }
      function renderCategories() {
        const cats = [
          { name: "آدم‌ها", desc: "چهره‌ها، دوستان و خانواده", img: 3 },
          { name: "مکان‌ها", desc: "گوشه‌هایی از جهان", img: 11 },
          { name: "سفر", desc: "سفرهای نزدیک و دور", img: 1 },
          { name: "طبیعت", desc: "فضای باز و جزئیاتش", img: 10 },
          { name: "خوراک و نوشیدنی", desc: "سفره‌ها، طعم‌ها و آیین‌ها", img: 9 },
        ];
        view.innerHTML = `${activeCategory === "All" ? `<div class="category-grid">${cats.map((c) => `<article class="category-card" data-cat="${c.name}"><img src="${all().find((p) => p.id === c.img)?.img || ""}" alt=""><div class="category-info"><h3>${c.name}</h3><p>${fa(all().filter((p) => p.category === c.name).length)} عکس</p></div></article>`).join("")}</div>` : `<div class="section-head compact-section"><button class="filter-chip" id="all-categories">→ همه‌ی دسته‌بندی‌ها</button><span class="collection-count">${activeCategory}</span></div>${gallery(all().filter((p) => p.category === activeCategory))}`}`;
        document.querySelectorAll("[data-cat]").forEach(
          (c) =>
            (c.onclick = () => {
              activeCategory = c.dataset.cat;
              renderCategories();
            }),
        );
        let back = document.getElementById("all-categories");
        if (back)
          back.onclick = () => {
            activeCategory = "All";
            renderCategories();
          };
      }
      function go(page) {
        stopFeed();
        currentPage = page;
        query = "";
        activeCategory = "All";
        activeAlbum = "All";
        document
          .querySelectorAll(".nav button")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.page === page),
          );
        document.getElementById("breadcrumb").textContent = {
          search: "جستجوی متنی",
          library: "همه‌ی تصاویر",
          albums: "آلبوم‌ها",
          categories: "دسته‌بندی‌ها",
        }[page];
        document.getElementById("sidebar").classList.remove("open");
        ({
          search: renderSearch,
          library: renderLibrary,
          albums: renderAlbums,
          categories: renderCategories,
        })[page]();
      }
      document.querySelectorAll(".nav button[data-page]").forEach((b) =>
        b.addEventListener("click", (e) => {
          const page = b.dataset.page;
          if (e.target.closest("[data-expand]")) return;
          go(page);
        }),
      );
      document.querySelectorAll("[data-expand]").forEach((toggle) => {
        const activate = () => {
          const page = toggle.dataset.expand;
          const panel = document.getElementById(
            page === "albums" ? "album-subnav" : "category-subnav",
          );
          const parent = toggle.closest("button[data-page]");
          const willOpen = !panel.classList.contains("open");
          document
            .querySelectorAll(".subnav")
            .forEach((x) => x.classList.remove("open"));
          document
            .querySelectorAll(".nav button[data-page]")
            .forEach((x) => x.setAttribute("aria-expanded", "false"));
          if (willOpen) {
            panel.classList.add("open");
            parent.setAttribute("aria-expanded", "true");
          }
        };
        toggle.addEventListener("click", (e) => {
          e.stopPropagation();
          activate();
        });
        toggle.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            activate();
          }
        });
      });
      document.querySelectorAll("[data-subpage]").forEach((b) =>
        b.addEventListener("click", () => {
          const page = b.dataset.subpage;
          go(page);
          if (page === "albums") {
            activeAlbum = b.dataset.subvalue;
            renderAlbums();
          } else {
            activeCategory = b.dataset.subvalue;
            renderCategories();
          }
          document
            .querySelectorAll(".subnav button")
            .forEach((x) => x.classList.toggle("active", x === b));
        }),
      );
      view.addEventListener("click", (e) => {
        const card = e.target.closest(".photo-card");
        if (card) openLightbox(card.dataset.photo);
      });
      view.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.classList.contains("photo-card"))
          openLightbox(e.target.dataset.photo);
      });
      function addFiles(list) {
        const files = [...list].filter((f) => f.type.startsWith("image/"));
        if (!files.length) { toast("تصویری پیدا نشد"); return; }
        files.forEach((file, i) => {
          customPhotos.push({
            id: "u" + Date.now() + "_" + i,
            title: file.name.replace(/\.[^.]+$/, "").replace(/[-_]/g, " "),
            bio: "عکسی از مجموعه‌ی خودتان.",
            place: "تازه اضافه‌شده",
            date: new Date().toISOString().slice(0, 10),
            category: "آدم‌ها",
            album: "تازه اضافه‌شده",
            tag: "عکس شما",
            favorite: false,
            img: URL.createObjectURL(file),
            alt: file.name,
          });
        });
        toast(`${fa(files.length)} عکس به این پیش‌نمایش اضافه شد`);
        if (currentPage === "library") renderLibrary();
        else if (currentPage === "search") renderSearch();
        else go("library");
      }
      document.getElementById("upload-btn").onclick = () => document.getElementById("file-input").click();
      document.getElementById("folder-btn").onclick = () => document.getElementById("folder-input").click();
      ["file-input", "folder-input"].forEach((id) =>
        document.getElementById(id).addEventListener("change", (e) => {
          addFiles(e.target.files);
          e.target.value = "";
        }),
      );
      document.getElementById("menu-toggle").onclick = () =>
        document.getElementById("sidebar").classList.toggle("open");
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape")
          document.getElementById("sidebar").classList.remove("open");
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          go("search");
          document.getElementById("photo-search")?.focus();
        }
      });
      /* sidebar collapse */
      const appEl = document.querySelector(".app"), sideToggle = document.getElementById("side-toggle");
      sideToggle.onclick = () => {
        const c = appEl.classList.toggle("collapsed");
        sideToggle.setAttribute("aria-expanded", String(!c));
        sideToggle.setAttribute("aria-label", c ? "باز کردن نوار کناری" : "جمع‌کردن نوار کناری");
      };
      document.querySelectorAll(".nav > button[data-page]").forEach((b) => {
        const t = b.querySelector(".nav-text");
        if (t) b.title = t.textContent;
      });

      /* lightbox + fullscreen */
      const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lb-img");
      let lbItems = [], lbIdx = 0;
      function lbShow() {
        const p = lbItems[lbIdx];
        if (!p) return;
        lbImg.src = p.img;
        lbImg.alt = p.alt;
        document.getElementById("lb-cap").textContent = `${p.title} · ${p.place}`;
        document.getElementById("lb-count").textContent = `${fa(lbIdx + 1)} / ${fa(lbItems.length)}`;
        const multi = lbItems.length > 1;
        document.getElementById("lb-prev").style.display = multi ? "" : "none";
        document.getElementById("lb-next").style.display = multi ? "" : "none";
      }
      function openLightbox(id) {
        const ids = [...view.querySelectorAll(".photo-card")].map((c) => String(c.dataset.photo));
        const pool = all();
        lbItems = ids.map((i) => pool.find((p) => String(p.id) === i)).filter(Boolean);
        lbIdx = Math.max(0, ids.indexOf(String(id)));
        lb.hidden = false;
        document.body.style.overflow = "hidden";
        lbShow();
      }
      function closeLightbox() {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        lb.hidden = true;
        lb.classList.remove("immersive");
        document.body.style.overflow = "";
      }
      function lbMove(d) {
        if (lbItems.length < 2) return;
        lbIdx = (lbIdx + d + lbItems.length) % lbItems.length;
        lbShow();
      }
      function toggleFull() {
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        const req = lb.requestFullscreen || lb.webkitRequestFullscreen;
        if (req) {
          const r = req.call(lb);
          if (r && r.catch) r.catch(() => lb.classList.toggle("immersive"));
        } else lb.classList.toggle("immersive");
      }
      document.getElementById("lb-close").onclick = closeLightbox;
      document.getElementById("lb-full").onclick = toggleFull;
      document.getElementById("lb-prev").onclick = () => lbMove(-1);
      document.getElementById("lb-next").onclick = () => lbMove(1);
      lbImg.addEventListener("dblclick", toggleFull);
      lb.addEventListener("click", (e) => {
        if (e.target === lb || e.target.classList.contains("lb-stage")) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (lb.hidden) return;
        if (e.key === "Escape" && !document.fullscreenElement) closeLightbox();
        else if (e.key === "ArrowLeft") lbMove(1);
        else if (e.key === "ArrowRight") lbMove(-1);
        else if (e.key.toLowerCase() === "f") toggleFull();
      });

      go("search");
    </script>
  </body>
</html>
