<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Design Options</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #24261f;
        background: #f5f5f0;
      }

      body {
        width: min(680px, calc(100% - 32px));
        margin: 64px auto;
      }

      a {
        display: block;
        margin: 12px 0;
        padding: 18px;
        border: 1px solid #deded5;
        border-radius: 8px;
        background: white;
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        border-color: #727b5d;
      }
    </style>
  </head>
  <body>
    <h1>UI design options</h1>
    <p>Each prototype is a standalone HTML file with its own styles and palette.</p>
    <a href="./terracotta.html">Terracotta and forest palette</a>
  </body>
</html>
