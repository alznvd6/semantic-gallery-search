<style>
:root{--bg:#f4f5f7;--paper:#ffffff;--ink:#1d2b40;--muted:#748092;--line:#e1e6ec;--primary:#203b63;--primary-dark:#142a49;--blue:#172b49;--mint:#e8edf4;--peach:#ece8e2;--yellow:#f2eee3;--lav:#e9edf3;--shadow:0 14px 40px #172b4914;--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background-color:var(--bg);background-image:radial-gradient(#43536b12 .7px,transparent .7px);background-size:17px 17px;color:var(--ink);font-family:"DM Sans",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{height:100vh;position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:28px 18px 22px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px;margin:0 0 48px}.brand-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#172b49,#36577f);display:grid;place-items:center;color:white;box-shadow:0 7px 18px #172b4930}.brand-icon svg{width:31px;height:31px}.brand-name{font-weight:750;font-size:17px;letter-spacing:-.65px;white-space:nowrap}.brand-name span{display:block;color:#7a8798;font-size:9px;letter-spacing:2.1px;text-transform:uppercase;margin-top:2px;font-weight:700}
.nav-label{padding:0 12px;margin:0 0 12px;color:#a1a8af;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.nav{display:grid;gap:7px}.nav button{width:100%;display:flex;align-items:center;gap:13px;padding:13px 14px;border:0;border-radius:13px;background:transparent;color:#707b86;text-align:left;font-size:13px;font-weight:650;transition:.18s}.nav button:hover{background:#edf1f6;color:var(--ink)}.nav button.active{background:#e7edf5;color:var(--primary-dark)}.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-note{margin-top:auto;padding:17px;border-radius:17px;background:linear-gradient(145deg,#eef2f8,#f8edf4);color:#455875}.side-note .sun{font-size:20px}.side-note strong{display:block;font-size:12px;margin:9px 0 5px;color:#172b4d}.side-note p{font-size:10px;line-height:1.6;margin:0;color:#718096}
.main{min-width:0;max-width:1680px;width:100%;margin:auto;padding:0 54px 55px}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:700}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:39px;height:39px;border:1px solid #dce2eb;border-radius:13px;background:white;color:#172b4d;display:grid;place-items:center}.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.upload{border:0;background:var(--primary);color:white;padding:12px 17px;border-radius:11px;font-size:12px;font-weight:750;box-shadow:0 7px 18px #203b6328}.upload:hover{background:var(--primary-dark);transform:translateY(-1px)}
.page-intro{padding:45px 0 24px}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--primary);font-weight:800;margin:0 0 11px}.page-intro h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(38px,4.5vw,58px);letter-spacing:-1.5px;line-height:1.05;margin:0 0 12px}.page-intro h1 em{color:var(--primary);font-weight:500}.page-intro p.sub{font-size:13px;color:var(--muted);margin:0;line-height:1.7}
.search-row{display:flex;align-items:center;gap:11px;margin:10px 0 30px}.searchbox{height:57px;max-width:740px;flex:1;display:flex;align-items:center;gap:13px;background:white;border:1px solid #e1e5ed;border-radius:16px;padding:0 17px;box-shadow:0 5px 20px #26334208}.searchbox svg{width:19px;stroke:#929ba4;fill:none;stroke-width:1.8}.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}.searchbox input::placeholder{color:#a7afb5}.search-submit{height:47px;padding:0 19px;border:0;border-radius:11px;background:var(--primary);color:white;font-size:12px;font-weight:750}.hint{font-size:11px;color:var(--muted);margin:0 0 30px}
.feature{position:relative;overflow:hidden;border-radius:18px;min-height:300px;margin:0 0 38px;background:#4c6c75;color:white;box-shadow:var(--shadow)}.feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.72)}.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#152d36c9 0%,#152d3650 55%,transparent 100%)}.feature-copy{position:relative;z-index:1;padding:42px 45px;max-width:490px}.feature-copy .eyebrow{color:#f5d9e9}.feature-copy h2{font-family:"Playfair Display",serif;font-weight:500;font-size:37px;line-height:1.12;margin:0 0 10px}.feature-copy p{font-size:12px;color:#ffffffd9;line-height:1.7;margin:0 0 20px}.feature-link{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;background:#ffffffed;color:#172b4d;border-radius:11px;font-size:11px;font-weight:800;border:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 18px}.section-head h2{font-family:"Playfair Display",serif;font-size:28px;font-weight:500;letter-spacing:-.5px;margin:0 0 5px}.section-head p{font-size:11px;color:var(--muted);margin:0}.section-actions{display:flex;align-items:center;gap:12px}.sort{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:#65717b;font-size:11px;outline:0}
.filters{display:flex;gap:8px;overflow:auto;padding:0 0 18px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#7c8790;padding:8px 13px;border-radius:30px;font-size:10px;font-weight:700}.filter-chip.active{background:#172b4d;border-color:#172b4d;color:#fff}
.gallery{columns:3 250px;column-gap:19px}.photo-card{display:inline-block;width:100%;break-inside:avoid;margin:0 0 19px;background:#fff;border:1px solid #e1e6e3;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #26334206;transition:transform .2s,box-shadow .2s;cursor:pointer}.photo-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo-wrap{position:relative;overflow:hidden;background:#f0eee9}.photo-wrap img{display:block;width:100%;height:auto;min-height:210px;max-height:440px;object-fit:cover;transition:transform .5s}.photo-card:hover .photo-wrap img{transform:scale(1.025)}.photo-tag{position:absolute;left:13px;top:13px;padding:7px 10px;border-radius:30px;background:#ffffffeb;color:#4a5962;font-size:9px;font-weight:800;letter-spacing:.4px;backdrop-filter:blur(8px)}.photo-info{padding:14px 15px 15px}.photo-title{font-size:13px;font-weight:750;margin:0 0 7px;letter-spacing:-.1px}.photo-bio{font-size:11px;color:#7c8790;line-height:1.55;margin:0 0 10px}.photo-meta{display:flex;align-items:center;justify-content:space-between;color:#929ba3;font-size:10px}.photo-meta span:first-child{display:flex;align-items:center;gap:5px}.photo-meta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7}
.album-grid,.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.album-card,.category-card{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}.album-card:hover,.category-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.album-cover{height:245px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;background:#fff;padding:4px}.album-cover img{width:100%;height:100%;object-fit:cover;min-height:0}.album-cover img:first-child{grid-row:span 2}.album-info{padding:16px 17px 18px}.album-info h3,.category-info h3{font-family:"Playfair Display",serif;font-size:21px;font-weight:500;margin:0 0 5px}.album-info p,.category-info p{font-size:11px;color:var(--muted);margin:0}.category-card{position:relative;min-height:240px;display:flex;align-items:flex-end;padding:22px;background:#dbe9e8;color:white;overflow:hidden}.category-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.68);transition:transform .5s}.category-card:hover img{transform:scale(1.04)}.category-card:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#172b32a8)}.category-info{position:relative;z-index:1}.category-info h3{font-size:25px;margin-bottom:5px}.category-info p{color:#ffffffd9}
.empty{padding:55px 20px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-family:"Playfair Display",serif;font-size:24px;font-weight:500;margin-bottom:6px}
.footer b{color:var(--primary)}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);background:#26323c;color:#fff;padding:12px 17px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 8px 30px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-menu{display:none}
@media(max-width:1100px){.main{padding:0 32px 45px}.album-grid,.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery{columns:2 230px}}

.subnav{display:none;margin:-2px 0 7px 43px;padding-left:13px;border-left:1px solid #dce3ec;gap:3px}
.subnav.open{display:grid}
.subnav button{width:100%;border:0;background:transparent;text-align:left;padding:8px 7px;color:#77827f;font-size:11px;border-radius:7px}
.subnav button:hover,.subnav button.active{background:#eaf0f7;color:var(--primary-dark)}
.nav-expand{margin-left:auto;width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:7px;font-size:16px;line-height:1;color:#78869a;transition:transform .2s,background .2s;cursor:pointer;z-index:2}.nav-expand:hover{background:#dce5f0;color:#172b49}.nav button[aria-expanded="true"] .nav-expand{transform:rotate(180deg);background:#e7edf5;color:#172b49}
.collection-count{font-size:11px;color:var(--muted);margin:0 0 14px}
.compact-section{align-items:center;margin:0 0 17px}
.compact-tools{padding-top:27px}
.filters{padding-top:0}
.photo-tag{background:#f7f8faed;color:#35465f}
@media(max-width:760px){.compact-tools{padding-top:20px}}

/* Minimal photography accents: quiet viewfinder corners, not a new visual theme. */
.photo-wrap:after{
  content:"";position:absolute;inset:10px;pointer-events:none;opacity:0;
  background:
    linear-gradient(#fff,#fff) left top/13px 1.5px no-repeat,
    linear-gradient(#fff,#fff) left top/1.5px 13px no-repeat,
    linear-gradient(#fff,#fff) right top/13px 1.5px no-repeat,
    linear-gradient(#fff,#fff) right top/1.5px 13px no-repeat,
    linear-gradient(#fff,#fff) left bottom/13px 1.5px no-repeat,
    linear-gradient(#fff,#fff) left bottom/1.5px 13px no-repeat,
    linear-gradient(#fff,#fff) right bottom/13px 1.5px no-repeat,
    linear-gradient(#fff,#fff) right bottom/1.5px 13px no-repeat;
  transition:opacity .22s ease;
}
.photo-card:hover .photo-wrap:after{opacity:.82}
.searchbox{position:relative}
.searchbox:before{
  content:"";width:7px;height:7px;border:1px solid #a7afb9;border-radius:50%;
  position:absolute;right:13px;top:11px;opacity:.5;pointer-events:none;
}


/* Photographer identity: small camera details, integrated into the existing interface. */
.brand-icon{border-radius:12px}
.brand-icon svg{width:34px;height:34px}
.nav-label{display:flex;align-items:center;gap:8px}
.mini-camera,.crumb-camera{
  position:relative;display:inline-block;width:13px;height:9px;flex:0 0 auto;
  border:1.2px solid currentColor;border-radius:2.5px;opacity:.72;
}
.mini-camera:before,.crumb-camera:before{
  content:"";position:absolute;left:3px;top:-3.5px;width:5px;height:3px;
  border:1px solid currentColor;border-bottom:0;border-radius:2px 2px 0 0;
}
.mini-camera:after,.crumb-camera:after{
  content:"";position:absolute;left:4px;top:1px;width:3px;height:3px;
  border:1px solid currentColor;border-radius:50%;
}
.crumb-camera{margin-right:7px;vertical-align:-1px;color:var(--primary)}
.page-intro{position:relative}
.page-intro:after{
  content:"";position:absolute;right:5px;top:42px;width:62px;height:46px;
  border:1px solid #203b6319;border-radius:9px;opacity:.8;
  background:
    radial-gradient(circle at 50% 56%,transparent 0 9px,#203b6320 9.5px 10.5px,transparent 11px),
    radial-gradient(circle at 50% 56%,transparent 0 4px,#203b6320 4.5px 5.5px,transparent 6px);
}
.page-intro:before{
  content:"";position:absolute;right:18px;top:35px;width:18px;height:7px;
  border:1px solid #203b6319;border-bottom:0;border-radius:4px 4px 0 0;
}
.searchbox{padding-left:17px}
@media(max-width:600px){.page-intro:after,.page-intro:before{display:none}}


.photographer-signature{
  margin-top:auto;padding:14px 11px 2px;display:flex;align-items:center;gap:10px;
  border-top:1px solid var(--line);color:#64748b
}
.signature-camera{width:31px;height:31px;display:grid;place-items:center;border:1px solid #dce3ec;border-radius:9px;color:var(--primary)}
.signature-camera svg{width:20px;height:20px}
.photographer-signature b{display:block;color:#34445c;font-size:10px;font-weight:750;letter-spacing:.1px}
.photographer-signature small{display:block;color:#929baa;font-size:9px;margin-top:3px}

</style>

];
let customPhotos=[],currentPage="search",activeCategory="All",activeAlbum="All",query="";
const view=document.getElementById("view"),all=()=>[...photos,...customPhotos];
function toast(msg){let el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
function photoCard(p){return `<article class="photo-card" tabindex="0" data-photo="${p.id}"><div class="photo-wrap"><img loading="lazy" src="${p.img}" alt="${p.alt}"><span class="photo-tag">${p.tag}</span></div><div class="photo-info"><h3 class="photo-title">${p.title}</h3><p class="photo-bio">${p.bio||"A moment worth keeping."}</p><div class="photo-meta"><span>⌖ ${p.place}</span><span>${new Date(p.date+"T12:00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</span></div></div></article>`}
function gallery(items){return items.length?`<div class="gallery">${items.map(photoCard).join("")}</div>`:`<div class="empty"><strong>No photos found yet.</strong>Try another search or add a few photos to your library.</div>`}
function intro(eyebrow,title,sub){return `<section class="page-intro"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="sub">${sub}</p></section>`}
function renderSearch(){
let filtered=all().filter(p=>!query||(p.title+" "+p.bio+" "+p.place+" "+p.category+" "+p.tag).toLowerCase().includes(query.toLowerCase()));
view.innerHTML=`${intro("THE PHOTOGRAPHER’S ARCHIVE","Every frame.<br><em>Within reach.</em>","Find the right shot by subject, location, collection, or the feeling you captured.")}<div class="search-row"><label class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="photo-search" value="${query.replace(/"/g,"&quot;")}" placeholder="Search subjects, locations, moods, or moments…"><span style="font-size:10px;color:#a1aab0">↵</span></label><button class="search-submit" id="search-submit">Find frames</button></div><div class="section-head"><div><h2>${query?"Matching frames":"Recently in your archive"}</h2><p>${query?"Your photographs matching this search":"A glimpse into your photographic collection"}</p></div><span style="font-size:11px;color:var(--muted)">${filtered.length} photos</span></div>${gallery(filtered)}`;
const input=document.getElementById("photo-search");input.addEventListener("input",e=>{query=e.target.value;let pos=e.target.selectionStart;renderSearch();let next=document.getElementById("photo-search");next.focus();next.setSelectionRange(pos,pos)});
document.getElementById("search-submit").onclick=()=>{query=input.value;renderSearch()};
input.addEventListener("keydown",e=>{if(e.key==="Enter"){query=input.value;renderSearch()}});

}
function renderLibrary(){
 let items=all();view.innerHTML=`<div class="compact-tools"><div class="filters" id="library-filters">${["All","People","Places","Travel","Nature","Food & drink"].map(x=>`<button class="filter-chip ${activeCategory===x?"active":""}" data-category="${x}">${x}</button>`).join("")}</div><div class="collection-count">${items.length} photos</div><div id="library-gallery">${gallery(activeCategory==="All"?items:items.filter(p=>p.category===activeCategory))}</div></div>`;
 document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;renderLibrary()});
}
function renderAlbums(){
 const albums=[{name:"Summer escape",desc:"Coastlines, quiet cabins & open roads",ids:[1,4,5,7],cover:[1,4,5]},{name:"People I love",desc:"The faces that make every day brighter",ids:[3,8,12],cover:[3,8,12]},{name:"Little rituals",desc:"Small joys from ordinary days",ids:[2,6,9,10],cover:[2,6,9]},{name:"City days",desc:"Wandering through new streets",ids:[11],cover:[11]}];
 view.innerHTML=`<div class="collection-count">${albums.length} albums</div>${activeAlbum==="All"?`<div class="album-grid">${albums.map(a=>`<article class="album-card" data-album="${a.name}"><div class="album-cover">${a.cover.map(id=>`<img src="${all().find(p=>p.id===id)?.img||""}" alt="">`).join("")}</div><div class="album-info"><h3>${a.name}</h3><p>${a.ids.length} photos</p></div></article>`).join("")}</div>`:`<div class="section-head compact-section"><button class="filter-chip" id="all-albums">← All albums</button><span class="collection-count">${activeAlbum}</span></div>${gallery(all().filter(p=>p.album===activeAlbum))}`}`;
 document.querySelectorAll("[data-album]").forEach(c=>c.onclick=()=>{activeAlbum=c.dataset.album;renderAlbums()});let back=document.getElementById("all-albums");if(back)back.onclick=()=>{activeAlbum="All";renderAlbums()};
}
function renderCategories(){
 const cats=[{name:"People",desc:"Faces, friends & family",img:3},{name:"Places",desc:"Corners of the world",img:11},{name:"Travel",desc:"Journeys near and far",img:1},{name:"Nature",desc:"The outdoors & its details",img:10},{name:"Food & drink",desc:"Tables, tastes & rituals",img:9}];
 view.innerHTML=`${activeCategory==="All"?`<div class="category-grid">${cats.map(c=>`<article class="category-card" data-cat="${c.name}"><img src="${all().find(p=>p.id===c.img)?.img||""}" alt=""><div class="category-info"><h3>${c.name}</h3><p>${all().filter(p=>p.category===c.name).length} photos</p></div></article>`).join("")}</div>`:`<div class="section-head compact-section"><button class="filter-chip" id="all-categories">← All categories</button><span class="collection-count">${activeCategory}</span></div>${gallery(all().filter(p=>p.category===activeCategory))}`}`;
 document.querySelectorAll("[data-cat]").forEach(c=>c.onclick=()=>{activeCategory=c.dataset.cat;renderCategories()});let back=document.getElementById("all-categories");if(back)back.onclick=()=>{activeCategory="All";renderCategories()};
}
function go(page){currentPage=page;query="";activeCategory="All";activeAlbum="All";document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("breadcrumb").textContent=({search:"Text Search",library:"Library",albums:"Albums",categories:"Categories"})[page];document.getElementById("sidebar").classList.remove("open");({search:renderSearch,library:renderLibrary,albums:renderAlbums,categories:renderCategories})[page]()}
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",e=>{
 const page=b.dataset.page;
 if(e.target.closest("[data-expand]")) return;
 go(page);
}));
document.querySelectorAll("[data-expand]").forEach(toggle=>{
 const activate=()=>{
   const page=toggle.dataset.expand;
   const panel=document.getElementById(page==="albums"?"album-subnav":"category-subnav");
   const parent=toggle.closest("button[data-page]");
   const willOpen=!panel.classList.contains("open");
   document.querySelectorAll(".subnav").forEach(x=>x.classList.remove("open"));
   document.querySelectorAll(".nav button[data-page]").forEach(x=>x.setAttribute("aria-expanded","false"));
   if(willOpen){panel.classList.add("open");parent.setAttribute("aria-expanded","true");}
 };
 toggle.addEventListener("click",e=>{e.stopPropagation();activate()});
 toggle.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();activate()}});
});
document.querySelectorAll("[data-subpage]").forEach(b=>b.addEventListener("click",()=>{
   const page=b.dataset.subpage;
   if(page==="albums"){activeAlbum=b.dataset.subvalue;go("albums");renderAlbums();}
   else {activeCategory=b.dataset.subvalue;go("categories");renderCategories();}
   document.querySelectorAll(".subnav button").forEach(x=>x.classList.toggle("active",x===b));
 }));
view.addEventListener("click",e=>{let card=e.target.closest(".photo-card");if(card)toast("Photo preview · Full-screen viewer can be connected next.")});
view.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("photo-card"))toast("Photo preview · Full-screen viewer can be connected next.")});
document.getElementById("upload-btn").onclick=()=>document.getElementById("file-input").click();
document.getElementById("file-input").addEventListener("change",e=>{[...e.target.files].forEach((file,i)=>{let url=URL.createObjectURL(file);customPhotos.push({id:"u"+Date.now()+i,title:file.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," "),bio:"A photo from your own collection.",place:"Recently added",date:new Date().toISOString().slice(0,10),category:"People",album:"Recently added",tag:"YOUR PHOTO",favorite:false,img:url,alt:file.name})});toast(`${e.target.files.length} photo${e.target.files.length===1?"":"s"} added to this preview`);if(currentPage==="library")renderLibrary();else if(currentPage==="search")renderSearch();else go("library");e.target.value=""});
document.getElementById("menu-toggle").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("sidebar").classList.remove("open");if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();go("search");document.getElementById("photo-search")?.focus()}});
go("search");
</script>
</body></html>
